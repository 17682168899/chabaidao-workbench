<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#FFB800">
  <title>备料 · 茶百道工作台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="emp-mobile">
  <!-- 顶部栏：当前登录员工 -->
  <header class="topbar">
    <h1>
      <span class="logo">茶</span>
      备料
    </h1>
    <div class="actions">
      <div class="user-bar">
        <div class="avatar" id="userAvatar">👤</div>
        <span class="uname" id="userName">—</span>
      </div>
      <button onclick="doLogout()">退出</button>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <h2 class="card-title"><span class="dot"></span>备料清单</h2>
      <div class="prep-summary">
        <div class="prep-stat"><div class="num" id="prepNeed">0</div><div class="lbl">需备料物料</div></div>
        <div class="prep-stat"><div class="num" id="prepTotal">0</div><div class="lbl">物料总数</div></div>
      </div>
      <div class="prep-list" id="prepList"></div>
      <div class="prep-empty" id="prepEmpty" style="display:none;">
        📦 当前库存充足，暂无需要备料的物料
      </div>
    </div>
  </div>

  <nav class="emp-tabbar">
    <button class="emp-tab" data-tab="attendance" onclick="location.href='employee.html'"><span class="ico">🏠</span><span>考勤</span></button>
    <button class="emp-tab" data-tab="recipe" onclick="location.href='recipe.html'"><span class="ico">📖</span><span>配方查询</span></button>
    <button class="emp-tab" data-tab="clean" onclick="location.href='clean.html'"><span class="ico">🧹</span><span>周清</span></button>
    <button class="emp-tab active" data-tab="prep" onclick="location.href='prep.html'"><span class="ico">📦</span><span>备料</span></button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script>
    let MATERIALS = [];
    let DONE = [];

    async function initPage() {
      await ChabaidaoDB.ready();
      const user = requireLogin('staff');
      if (!user) return;
      document.getElementById('userAvatar').textContent = user.name.charAt(0);
      document.getElementById('userName').textContent = user.name;

      const mats = ChabaidaoDB.getMaterials();
      MATERIALS = mats && mats.length ? mats : defaultMaterials();
      if (!mats || !mats.length) ChabaidaoDB.setMaterials(MATERIALS);

      DONE = ChabaidaoDB.getPrepDone();
      document.getElementById('prepTotal').textContent = MATERIALS.length;
      renderPrep();
      // 备料「已备」状态云端同步（多人/多端共享）
      ChabaidaoDB.onRemoteChange(() => {
        DONE = ChabaidaoDB.getPrepDone();
        renderPrep();
      });
    }

    function renderPrep() {
      const list = document.getElementById('prepList');
      const empty = document.getElementById('prepEmpty');

      // 库存低于预警线的物料优先（需备料），其余按缺口排序展示
      const needPrep = MATERIALS.filter((m) => m.stock <= m.warnLine);
      document.getElementById('prepNeed').textContent = needPrep.length;

      const sorted = MATERIALS.slice().sort((a, b) => {
        const ga = a.warnLine - a.stock;
        const gb = b.warnLine - b.stock;
        if (ga !== gb) return gb - ga; // 缺口大的在前
        return a.category.localeCompare(b.category);
      });

      if (sorted.length === 0) {
        list.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      list.innerHTML = sorted.map((m) => {
        const gap = Math.max(0, m.warnLine - m.stock);
        const suggest = Math.max(m.warnLine * 2 - m.stock, gap);
        const isWarn = m.stock <= m.warnLine;
        const done = DONE.includes(m.id);
        const gapText = gap > 0
          ? `缺口 <span class="gap">${gap} ${escapeHtml(m.unit)}</span>，建议备 ${suggest} ${escapeHtml(m.unit)}`
          : `库存充足（预警线 ${escapeHtml(String(m.warnLine))} ${escapeHtml(m.unit)}）`;
        return `
          <div class="prep-row ${isWarn ? 'warn' : 'ok'} ${done ? 'done' : ''}">
            <div class="prep-main">
              <div class="prep-name">${escapeHtml(m.name)}<span class="prep-cat">${escapeHtml(m.category)}</span></div>
              <div class="prep-sub">当前库存 ${escapeHtml(String(m.stock))} / ${escapeHtml(m.unit)} · ${gapText}</div>
            </div>
            <div class="prep-ops">
              <button class="prep-done-btn" onclick="togglePrep('${m.id}')">${done ? '已备✓' : '标记已备'}</button>
            </div>
          </div>`;
      }).join('');
    }

    function togglePrep(id) {
      const idx = DONE.indexOf(id);
      if (idx >= 0) DONE.splice(idx, 1);
      else DONE.push(id);
      ChabaidaoDB.setPrepDone(DONE);
      renderPrep();
    }

    function doLogout() {
      logout();
      window.location.href = 'login.html';
    }
    initPage();
  </script>
</body>
</html>
