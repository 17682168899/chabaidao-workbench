<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#FFB800">
  <title>周清 · 茶百道工作台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="emp-mobile">
  <!-- 顶部栏：当前登录员工 -->
  <header class="topbar">
    <h1>
      <span class="logo">茶</span>
      周清
    </h1>
    <div class="actions">
      <div class="user-bar">
        <div class="avatar" id="userAvatar">👤</div>
        <span class="uname" id="userName">—</span>
      </div>
      <button onclick="doLogout()">退出</button>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <h2 class="card-title"><span class="dot"></span>本周清洁任务</h2>
      <div class="clean-progress">
        <span class="cp-text">已完成 <b id="cpDone">0</b>/<span id="cpTotal">0</span></span>
        <div class="progress-bar"><div class="progress-fill" id="cpFill"></div></div>
      </div>
      <div class="clean-list" id="cleanList"></div>
      <div class="clean-reset">
        <button onclick="resetCleanWeek()">重置本周</button>
      </div>
    </div>
  </div>

  <nav class="emp-tabbar">
    <button class="emp-tab" data-tab="attendance" onclick="location.href='employee.html'"><span class="ico">🏠</span><span>考勤</span></button>
    <button class="emp-tab" data-tab="recipe" onclick="location.href='recipe.html'"><span class="ico">📖</span><span>配方查询</span></button>
    <button class="emp-tab active" data-tab="clean" onclick="location.href='clean.html'"><span class="ico">🧹</span><span>周清</span></button>
    <button class="emp-tab" data-tab="prep" onclick="location.href='prep.html'"><span class="ico">📦</span><span>备料</span></button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script>
    let TASKS = [];
    let WEEK_KEY = '';
    let DONE = [];

    async function initPage() {
      await ChabaidaoDB.ready();
      const user = requireLogin('staff');
      if (!user) return;
      document.getElementById('userAvatar').textContent = user.name.charAt(0);
      document.getElementById('userName').textContent = user.name;

      TASKS = ChabaidaoDB.getCleanTasks();
      WEEK_KEY = 'clean_' + isoWeekKey(new Date());
      DONE = ChabaidaoDB.getCleanDone(WEEK_KEY);

      document.getElementById('cpTotal').textContent = TASKS.length;
      renderClean();
      // 多人/多端勾选状态实时同步（云端共享）
      ChabaidaoDB.onRemoteChange(() => {
        TASKS = ChabaidaoDB.getCleanTasks();
        DONE = ChabaidaoDB.getCleanDone(WEEK_KEY);
        document.getElementById('cpTotal').textContent = TASKS.length;
        renderClean();
      });
    }

    function renderClean() {
      const list = document.getElementById('cleanList');
      list.innerHTML = TASKS.map((t) => {
        const done = DONE.includes(t.id);
        return `
          <div class="clean-task ${done ? 'done' : ''}" onclick="toggleClean('${t.id}')">
            <div class="check">${done ? '✓' : ''}</div>
            <div class="info">
              <div class="ct-head">
                <span class="ct-area">${escapeHtml(t.area)}</span>
                <span class="ct-name">${escapeHtml(t.name)}</span>
              </div>
              <div class="ct-note">${escapeHtml(t.note)}</div>
            </div>
          </div>`;
      }).join('');

      const doneCount = DONE.length;
      document.getElementById('cpDone').textContent = doneCount;
      const pct = TASKS.length ? Math.round((doneCount / TASKS.length) * 100) : 0;
      document.getElementById('cpFill').style.width = pct + '%';
    }

    function toggleClean(id) {
      const idx = DONE.indexOf(id);
      if (idx >= 0) DONE.splice(idx, 1);
      else DONE.push(id);
      ChabaidaoDB.setCleanDone(WEEK_KEY, DONE);
      renderClean();
    }

    function resetCleanWeek() {
      if (!confirm('确定重置本周清洁任务？已勾选状态将清空。')) return;
      DONE = [];
      ChabaidaoDB.setCleanDone(WEEK_KEY, DONE);
      renderClean();
      showToast('已重置本周');
    }

    function doLogout() {
      logout();
      window.location.href = 'login.html';
    }
    initPage();
  </script>
</body>
</html>
