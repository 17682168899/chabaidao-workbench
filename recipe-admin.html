<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#2563EB">
  <title>配方管理 · 茶百道工作台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-desktop">
  <header class="topbar">
    <h1>
      <span class="logo">茶</span>
      配方管理
    </h1>
    <div class="actions">
      <button onclick="goManagement()">🏠 管理后台</button>
      <button onclick="doLogout()">退出</button>
    </div>
  </header>

  <div class="container">
    <!-- 统计 -->
    <div class="card">
      <h2 class="card-title"><span class="dot"></span>配方概览</h2>
      <div class="mat-stat-grid">
        <div class="stat-item">
          <div class="num" id="totalCount">0</div>
          <div class="label">配方总数</div>
        </div>
        <div class="stat-item warn">
          <div class="num" id="catCount">0</div>
          <div class="label">分类数</div>
        </div>
      </div>
    </div>

    <!-- 添加 / 编辑 -->
    <div class="card">
      <h2 class="card-title"><span class="dot"></span><span id="formTitle">添加配方</span></h2>
      <form id="rcpForm" class="kv-form" onsubmit="return saveRecipe(event)">
        <div class="kv-row">
          <label>配方名称</label>
          <input type="text" id="rcpName" placeholder="如 生椰拿铁" required>
        </div>
        <div class="kv-row">
          <label>分类</label>
          <select id="rcpCat">
            <option>咖啡</option>
            <option>真鲜奶茶·轻乳茶</option>
            <option>水果茶</option>
            <option>超人气奶茶</option>
            <option>其他</option>
          </select>
        </div>
        <div class="kv-row">
          <label>配料（每行「名称 用量」，如：黄金糖 20cc）</label>
          <textarea id="rcpIngs" rows="4" placeholder="黄金糖 20cc&#10;净水 200ml&#10;咖啡 美式-标准 1 份"></textarea>
        </div>
        <div class="kv-row">
          <label>制作步骤</label>
          <textarea id="rcpSteps" rows="3" placeholder="杯中加黄金糖 → 按「美式-标准」出咖啡 → ……"></textarea>
        </div>
        <div class="kv-actions">
          <button type="submit" class="btn primary" id="rcpSubmitBtn">添加配方</button>
          <button type="button" class="btn ghost" id="rcpCancelBtn" onclick="cancelEdit()" style="display:none;">取消编辑</button>
        </div>
      </form>
    </div>

    <!-- 配方清单 -->
    <div class="card">
      <h2 class="card-title"><span class="dot"></span>配方清单</h2>
      <div class="mat-list" id="rcpList"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/data.js"></script>
  <script src="js/recipe-admin.js"></script>
</body>
</html>
