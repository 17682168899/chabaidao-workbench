<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#FFB800">
  <title>配方查询 · 茶百道工作台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="emp-mobile">
  <!-- 顶部栏：当前登录员工 -->
  <header class="topbar">
    <h1>
      <span class="logo">茶</span>
      配方查询
    </h1>
    <div class="actions">
      <div class="user-bar">
        <div class="avatar" id="userAvatar">👤</div>
        <span class="uname" id="userName">—</span>
      </div>
      <button onclick="doLogout()">退出</button>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <h2 class="card-title"><span class="dot"></span>配方查询</h2>
      <div class="search-box">
        <span class="search-ico">🔍</span>
        <input type="text" id="recipeSearch" placeholder="搜索配方名 / 分类 / 配料（如：奶茶、柠檬、珍珠）" oninput="onRecipeSearch()">
        <span class="clear-ico" id="recipeClear" onclick="clearRecipeSearch()">✕</span>
      </div>
      <div class="recipe-count" id="recipeCount"></div>
      <div class="recipe-list" id="recipeList"></div>
      <div class="empty-state" id="recipeEmpty" style="display:none;">
        <div class="icon">🔍</div>
        <p>没有匹配的配方</p>
        <p style="font-size:12px;color:var(--text-3);margin-top:4px;">试试更换关键词，或查看全部配方</p>
      </div>
    </div>
  </div>

  <nav class="emp-tabbar">
    <button class="emp-tab" data-tab="attendance" onclick="location.href='employee.html'"><span class="ico">🏠</span><span>考勤</span></button>
    <button class="emp-tab active" data-tab="recipe" onclick="location.href='recipe.html'"><span class="ico">📖</span><span>配方查询</span></button>
    <button class="emp-tab" data-tab="clean" onclick="location.href='clean.html'"><span class="ico">🧹</span><span>周清</span></button>
    <button class="emp-tab" data-tab="prep" onclick="location.href='prep.html'"><span class="ico">📦</span><span>备料</span></button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script>
    let RECIPES = [];
    let currentKw = '';

    async function initPage() {
      await ChabaidaoDB.ready();
      const user = requireLogin('staff');
      if (!user) return;
      document.getElementById('userAvatar').textContent = user.name.charAt(0);
      document.getElementById('userName').textContent = user.name;
      RECIPES = ChabaidaoDB.getRecipes();
      renderRecipes(currentKw);
      // 后台修改配方后实时刷新（云端多人共享）
      ChabaidaoDB.onRemoteChange(() => {
        RECIPES = ChabaidaoDB.getRecipes();
        renderRecipes(currentKw);
      });
    }

    function onRecipeSearch() {
      const kw = document.getElementById('recipeSearch').value.trim();
      currentKw = kw;
      document.getElementById('recipeClear').classList.toggle('show', kw.length > 0);
      renderRecipes(kw);
    }

    function clearRecipeSearch() {
      document.getElementById('recipeSearch').value = '';
      currentKw = '';
      document.getElementById('recipeClear').classList.remove('show');
      renderRecipes('');
    }

    function renderRecipes(kw) {
      const list = document.getElementById('recipeList');
      const empty = document.getElementById('recipeEmpty');
      const countEl = document.getElementById('recipeCount');
      const k = kw.toLowerCase();

      const matched = RECIPES.filter((r) => {
        if (!k) return true;
        if (r.name.toLowerCase().includes(k)) return true;
        if (r.cat && r.cat.toLowerCase().includes(k)) return true;
        return (r.ingredients || []).some((ing) => ing.name.toLowerCase().includes(k));
      });

      countEl.textContent = kw ? `匹配到 ${matched.length} 个配方` : `共 ${RECIPES.length} 个配方`;

      if (matched.length === 0) {
        list.innerHTML = '';
        list.style.display = 'none';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';
      list.style.display = 'block';

      list.innerHTML = matched.map((r) => {
        const ings = (r.ingredients || []).map((ing) =>
          `<div class="ing-item">
             <span class="ing-name">${escapeHtml(ing.name)}</span>
             <span class="ing-qty">${escapeHtml(ing.qty || '')}</span>
           </div>`
        ).join('');
        const steps = r.steps
          ? `<div class="recipe-steps"><span class="lbl">做法</span>${escapeHtml(r.steps)}</div>`
          : '';
        return `
          <div class="recipe-card">
            <div class="recipe-head">
              <span class="recipe-name">${escapeHtml(r.name)}</span>
              <span class="recipe-cat">${escapeHtml(r.cat || '其他')}</span>
            </div>
            <div class="recipe-ing">${ings}</div>
            ${steps}
          </div>`;
      }).join('');
    }

    function doLogout() {
      logout();
      window.location.href = 'login.html';
    }
    initPage();
  </script>
</body>
</html>
