<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#FFB800">
  <title>员工端 · 茶百道工作台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="emp-mobile">
  <!-- 顶部栏：当前登录员工 -->
  <header class="topbar">
    <h1>
      <span class="logo">茶</span>
      员工端
    </h1>
    <div class="actions">
      <div class="user-bar">
        <div class="avatar" id="userAvatar">👤</div>
        <span class="uname" id="userName">—</span>
      </div>
      <button onclick="doLogout()">退出</button>
    </div>
  </header>

  <div class="container">

    <!-- 概览问候 -->
    <div class="emp-hero">
      <div class="emp-hero-top">
        <div>
          <div class="emp-greet" id="empGreet">你好</div>
          <div class="emp-date" id="empDate">—</div>
        </div>
        <div class="emp-today">
          <div class="emp-today-num" id="heroTodayHours">0<small>h</small></div>
          <div class="emp-today-lbl">今日工时</div>
        </div>
      </div>
      <div class="emp-shift" id="empShift">🕒 今日班次 —</div>
    </div>

    <!-- 今日考勤班次 -->
    <div class="card" id="sec-today">
      <h2 class="card-title"><span class="dot"></span>今日考勤班次</h2>
      <div class="today-shift" id="todayShiftBox"></div>
    </div>

    <!-- 本月考勤日历 -->
    <div class="card" id="sec-cal">
      <h2 class="card-title"><span class="dot"></span>本月考勤日历</h2>
      <div class="legend">
        <span><i class="sw work"></i>有班次</span>
        <span><i class="sw empty"></i>无班次</span>
      </div>
      <div class="month-nav">
        <button onclick="shiftMonth(-1)">‹</button>
        <div class="month-label" id="monthLabel">—</div>
        <button onclick="shiftMonth(1)">›</button>
      </div>
      <div class="calendar" id="calendar"></div>
    </div>

    <!-- 工时统计 -->
    <div class="card" id="sec-stats">
      <h2 class="card-title"><span class="dot"></span>工时统计</h2>
      <div class="seg" id="statSeg">
        <button class="seg-btn active" data-period="week" onclick="switchStatPeriod('week')">本周</button>
        <button class="seg-btn" data-period="month" onclick="switchStatPeriod('month')">本月</button>
      </div>
      <div class="stat-grid" id="hoursStatGrid"></div>
    </div>

    <!-- 当日其他员工班表 -->
    <div class="card" id="sec-others">
      <h2 class="card-title"><span class="dot"></span>今日同事班次</h2>
      <div class="legend">
        <span><i class="sw work"></i>在岗</span>
        <span><i class="sw rest"></i>休息</span>
        <span><i class="sw empty"></i>未排</span>
      </div>
      <div class="today-list" id="todayList"></div>
    </div>

  </div>

  <!-- 底部导航 -->
  <nav class="emp-tabbar">
    <button class="emp-tab active" data-target="top"><span class="ico">🏠</span><span>概览</span></button>
    <button class="emp-tab" data-target="sec-cal"><span class="ico">📅</span><span>日历</span></button>
    <button class="emp-tab" data-target="sec-stats"><span class="ico">📊</span><span>工时</span></button>
    <button class="emp-tab" data-target="sec-others"><span class="ico">👥</span><span>同事</span></button>
  </nav>

  <!-- 日历日详情弹窗 -->
  <div class="modal-backdrop" id="dayModal" onclick="if(event.target===this)closeDayModal()">
    <div class="modal detail-modal">
      <h3 id="dayModalTitle">上班时间</h3>
      <div class="detail-body" id="dayModalBody"></div>
      <div class="actions"><button class="btn" onclick="closeDayModal()">知道了</button></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/data.js"></script>
  <script src="js/employee.js"></script>
</body>
</html>
