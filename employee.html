<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#FFB800">
  <title>员工端 · 茶百道工作台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 顶部栏：当前登录员工 -->
  <header class="topbar">
    <h1>
      <span class="logo">茶</span>
      员工端
    </h1>
    <div class="actions">
      <div class="user-bar">
        <div class="avatar" id="userAvatar">👤</div>
        <span class="uname" id="userName">—</span>
      </div>
      <button onclick="doLogout()">退出</button>
    </div>
  </header>

  <div class="container">

    <!-- 统计卡片 -->
    <div class="card">
      <h2 class="card-title"><span class="dot"></span>本周工时</h2>
      <div class="stat-grid">
        <div class="stat-item">
          <div class="num" id="statWeekHours">0<small>h</small></div>
          <div class="label">本周工时</div>
        </div>
        <div class="stat-item">
          <div class="num" id="statTodayHours">0<small>h</small></div>
          <div class="label">今日工时</div>
        </div>
        <div class="stat-item">
          <div class="num" id="statDays">0<small>天</small></div>
          <div class="label">上班天数</div>
        </div>
      </div>
    </div>

    <!-- 周切换 -->
    <div class="week-nav">
      <button onclick="shiftW(-1)">‹</button>
      <div class="week-label">
        <div class="range" id="weekRange">本周</div>
        <div class="meta" id="weekMeta">共 7 天</div>
      </div>
      <button onclick="shiftW(1)">›</button>
    </div>

    <!-- 个人考勤日历 -->
    <div class="card">
      <h2 class="card-title"><span class="dot"></span>个人考勤日历</h2>
      <div class="legend">
        <span><i class="sw work"></i>有班</span>
        <span><i class="sw empty"></i>休息</span>
      </div>
      <div class="calendar" id="calendar"></div>
    </div>

    <!-- 当周班表（自己的） -->
    <div class="card">
      <h2 class="card-title"><span class="dot"></span>本周班表</h2>
      <div class="schedule-wrap">
        <div class="schedule-scroll">
          <table class="schedule-table" id="mySchedule"></table>
        </div>
      </div>
    </div>

    <!-- 当日其他员工班表 -->
    <div class="card">
      <h2 class="card-title"><span class="dot"></span>今日同事班次</h2>
      <div class="legend">
        <span><i class="sw work"></i>在岗</span>
        <span><i class="sw rest"></i>休息</span>
        <span><i class="sw empty"></i>未排</span>
      </div>
      <div class="today-list" id="todayList"></div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/data.js"></script>
  <script src="js/employee.js"></script>
</body>
</html>
