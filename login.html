<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#FFB800">
  <title>登录 · 茶百道工作台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand">
        <div class="logo">🧋</div>
        <h1>茶百道工作台</h1>
        <p>请登录后进入工作台</p>
      </div>

      <div class="login-error" id="errBox"></div>

      <form id="loginForm" onsubmit="return doLogin(event)">
        <div class="form-group">
          <label for="username">账号</label>
          <input type="text" id="username" placeholder="请输入登录账号" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn primary">登 录</button>
      </form>

      <div class="login-hint">
        <strong>演示账号</strong><br>
        管理员：<code>admin</code> / <code>123456</code><br>
        员工：<code>jmd</code> <code>cyy</code> <code>wyc</code> 等 / <code>123456</code>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/data.js"></script>
  <script>
    ChabaidaoDB.ready().then(function () {
      const DATA = loadData();

      // 已登录则直接跳转
      const cur = getCurrentUser(DATA);
      if (cur) {
        window.location.replace(cur.role === 'admin' ? 'management.html' : 'employee.html');
        return;
      }

      window.doLogin = function (e) {
        e.preventDefault();
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value;
        const errBox = document.getElementById('errBox');

        const emp = login(DATA, u, p);
        if (!emp) {
          errBox.textContent = '账号或密码错误，请重试';
          errBox.classList.add('show');
          document.getElementById('password').value = '';
          return false;
        }
        errBox.classList.remove('show');
        // 跳转
        window.location.href = emp.role === 'admin' ? 'management.html' : 'employee.html';
        return false;
      };
    });
  </script>
</body>
</html>
